global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: hrm-app
    metrics_path: /metrics
    static_configs:
      - targets: ['app:3000']
  - job_name: nginx
    metrics_path: /stub_status
    static_configs:
      - targets: ['nginx:80']
